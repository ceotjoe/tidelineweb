# Nginx configuration for tideline.holzapfel-online.de
# Place in /etc/nginx/sites-available/tideline.holzapfel-online.de and symlink to sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name tideline.holzapfel-online.de;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tideline.holzapfel-online.de;

    # SSL Certificates (managed by certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tideline.holzapfel-online.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tideline.holzapfel-online.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Web root directory
    root /var/www/tideline.holzapfel-online.de;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with immutable cache headers
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Disallow access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
