<!doctype html><meta charset="utf-8"><title>OG</title>
<style>
@font-face{font-family:A;src:url(../assets/fonts/AtkinsonHyperlegible-Regular.ttf)}
@font-face{font-family:A;font-weight:700;src:url(../assets/fonts/AtkinsonHyperlegible-Bold.ttf)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F6F1E7;font-family:A,sans-serif;color:#12343B}
svg{position:absolute;inset:0}svg path{fill:none;stroke:#1F6F68;stroke-width:1.6;opacity:.35}svg path.idx{stroke-width:2.8;opacity:.6}
.c{position:absolute;left:80px;top:90px;width:700px}
.i{width:120px;height:120px;border-radius:28px;box-shadow:0 10px 30px rgba(18,52,59,.25)}
h1{font:700 104px "Iowan Old Style",Palatino,Georgia,serif;margin:36px 0 10px;letter-spacing:-2px}
p{font-size:42px;line-height:1.25;margin:0;font-weight:700;color:#1F6F68}
.b{position:absolute;left:80px;bottom:50px;font-size:28px;color:#3E5C61}
</style>
<svg id="t" width="1200" height="630" viewBox="0 0 1200 630"></svg>
<div class="c"><img class="i" src="../assets/img/tideline-icon.svg"><h1>Tideline</h1><p id="p"></p></div>
<div class="b" id="b"></div>
<script>
var l=new URLSearchParams(location.search).get('lang')||'de';
document.getElementById('p').textContent=l==='de'?'Der Offline-Logger für Wavelog':'The offline logger for Wavelog';
document.getElementById('b').textContent=l==='de'?'SOTA · POTA · WWFF · Contest · Open Source (MIT)':'SOTA · POTA · WWFF · Contest · Open source (MIT)';
var o='',cx=1010,cy=250;
for(var k=1;k<=20;k++){var r=k*30,pts=[];for(var i=0;i<56;i++){var a=i/56*Math.PI*2,w=1+.22*Math.sin(a*3+k*.15)+.12*Math.sin(a*5-k*.25)+.07*Math.sin(a*9+k*.4);pts.push((cx+Math.cos(a)*r*1.3*w).toFixed(0)+' '+(cy+Math.sin(a)*r*w).toFixed(0))}
o+='<path '+(k%5==0?'class="idx" ':'')+'d="M'+pts.join(' L')+'Z"/>'}
document.getElementById('t').innerHTML=o;
</script>
