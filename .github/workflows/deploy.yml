name: Deploy Tideline Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build static pages
        run: python3 tools/build.py

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Assemble dist/
        run: |
          mkdir -p dist
          cp -r index.html de en legacy assets \
            favicon.svg favicon-32.png apple-touch-icon.png sitemap.xml robots.txt .htaccess dist/

      - name: Deploy to Web Server (rsync over SSH)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR || '/var/www/tideline.holzapfel-online.de' }}
        run: |
          if [ -z "$DEPLOY_SSH_HOST" ]; then echo "No DEPLOY_SSH_HOST secret set, skipping deploy."; exit 0; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete dist/ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_TARGET_DIR"
          echo "DEPLOYED=1" >> "$GITHUB_ENV"

      - name: Smoke test legacy URLs (store links must return 200 without redirect)
        if: env.DEPLOYED == '1'
        run: |
          sleep 5
          for p in privacy imprint datenschutz impressum; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tideline.holzapfel-online.de/$p")
            echo "/$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
